<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="sign-up.css">
</head>
<body>
    <div>
        <div class="text-container">
            <h1>Sign Up</h1>
            <p>Please fill the following fields</p>
        </div>
        <form action="">
            <div class="form-container">
                <label for="First name">
                    <p>First name</p>
                    <input type="text" id="firstname" name="first  name" placeholder="Candice">
                </label>
                <label for="Lastname">
                    <p>Last name</p>
                    <input type="text" id="lastname" name="lastname" placeholder="Noots">
                </label>
                <label for="Email">
                    <p>Email</p>
                    <input type="text" id="email" name="email" placeholder="you@example.com">
                </label>
                <label for="password">
                    <p>Password</p>
                    <input type="text" id="Password" name="Password" placeholder="Enter your password">
                </label>
                <label for="confirmpassword">
                    <p>Confirm password</p>
                    <input type="text" id="ConfirmPassword" name="confirm Password" placeholder="confirm your password">
                </label>
            </div>
        </form>
        <Button><a href="Login.html">Sign up </a></Button>
    </div>
        
</body>
</html>
